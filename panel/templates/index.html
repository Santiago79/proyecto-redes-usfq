<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Ataques | EmpresaX</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 50px; }
        .btn { 
            padding: 15px 25px; margin: 10px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s;
        }
        .udp { background: #3b82f6; } 
        .syn { background: #ef4444; } 
        .http { background: #f59e0b; } 
        .sqli { background: #8b5cf6; } 
        .stop { background: #6b7280; width: 100%; margin-top: 20px; } 
        .btn:hover { opacity: 0.8; transform: scale(1.05); }
        
        .activo { color: #10b981 !important; font-weight: bold; animation: blink 1s linear infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <h1>🚀 Panel de Control DDoS y Explotación</h1>
    <p>Objetivo: 172.20.10.10</p>
    
    <button class="btn udp" onclick="lanzar('udp', 'UDP Flood')">UDP Flood</button>
    <button class="btn syn" onclick="lanzar('syn', 'SYN Flood (Rand Source)')">SYN Flood</button>
    
    <button class="btn http" onclick="lanzar('http', 'HTTP GET Flood')">HTTP Flood</button>
    <button class="btn sqli" onclick="lanzar('sqli_dos', 'SQLi Time-Based DoS')">SQLi DoS</button>
    
    <br>
    <button class="btn stop" onclick="lanzar('stop', 'Detener')">🛑 DETENER TODOS LOS ATAQUES</button>

    <p id="status" style="margin-top: 20px; color: #94a3b8; font-size: 1.2rem;">
        Sistema en espera...
    </p>

    <script>
        function lanzar(ruta, nombreReal) {
            const statusEl = document.getElementById('status');
            
            if (ruta === 'stop') {
                statusEl.innerText = "🛑 Deteniendo todos los ataques...";
                statusEl.className = "";
                statusEl.style.color = "#ef4444";
            } else {
                statusEl.innerText = "🔥 Ejecutando: " + nombreReal;
                statusEl.className = "activo";
            }

            fetch('/atacar/' + ruta)
                .then(response => {
                    if (ruta === 'stop') {
                        setTimeout(() => {
                            statusEl.innerText = "✅ Sistema limpio. En espera...";
                            statusEl.style.color = "#94a3b8";
                        }, 1000);
                    }
                })
                .catch(error => {
                    statusEl.innerText = "❌ Error al ejecutar ataque";
                    statusEl.style.color = "#ef4444";
                    console.error(error);
                });
        }
    </script>
</body>
</html>
