global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: docker_metrics_exporter
    scrape_interval: 5s
    static_configs:
      - targets:
          - docker_metrics_exporter:9151

  - job_name: panel_control
    static_configs:
      - targets:
          - panel_control:5000

  - job_name: mysqld_exporter
    static_configs:
      - targets:
          - mysqld_exporter:9104

  - job_name: apache_exporter
    static_configs:
      - targets:
          - apache_exporter:9117

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://172.20.10.10/
          - http://panel_control:5000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - 172.20.20.10:3306
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
