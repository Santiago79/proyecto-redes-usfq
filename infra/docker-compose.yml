services:
  router:
    build:
      context: .
      dockerfile: router.Dockerfile
    container_name: router
    networks:
      red_publica:
        ipv4_address: 172.20.10.254
      red_privada:
        ipv4_address: 172.20.20.254
      red_ataque:
        ipv4_address: 172.20.30.254
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
        echo 'Configurando forwarding...' &&
        iptables -P FORWARD ACCEPT &&
        iptables -F FORWARD &&

        echo 'Router listo' &&
        tail -f /dev/null
      "
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: base_datos
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: empresa
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      red_privada:
        ipv4_address: 172.20.20.10
    cap_add:
      - NET_ADMIN
    entrypoint: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq iproute2 &&

        echo 'Configurando rutas DB...' &&
        ip route add 172.20.10.0/24 via 172.20.20.254 || true &&
        ip route add 172.20.30.0/24 via 172.20.20.254 || true &&

        exec docker-entrypoint.sh mysqld
      "
    command: >
      --bind-address=0.0.0.0
      --skip-log-bin
      --innodb-buffer-pool-size=64M
      --innodb-log-file-size=16M
      --max_connections=50
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: php:8.2-apache
    container_name: servidor_web
    depends_on:
      db:
        condition: service_healthy
    networks:
      red_publica:
        ipv4_address: 172.20.10.10
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html:ro
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y -qq iproute2 net-tools default-mysql-client &&

        echo 'Configurando rutas WEB...' &&
        ip route add 172.20.20.0/24 via 172.20.10.254 || true &&
        ip route add 172.20.30.0/24 via 172.20.10.254 || true &&

        echo 'Esperando DB...' &&
        sleep 5 &&

        exec apache2-foreground
      "

  atacante:
    image: dyrnq/nettools:latest
    container_name: atacante
    networks:
      red_ataque:
        ipv4_address: 172.20.30.10
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y -qq iproute2 iputils-ping iperf3 &&

        sleep 3 &&

        ip route add 172.20.10.0/24 via 172.20.30.254 || true &&
        ip route add 172.20.20.0/24 via 172.20.30.254 || true &&

        echo 'Rutas configuradas en atacante:' &&
        ip route &&

        tail -f /dev/null
      "

  monitor:
    build:
      context: .
      dockerfile: monitor.Dockerfile
    container_name: monitor
    networks:
      red_publica:
        ipv4_address: 172.20.10.50
      red_privada:
        ipv4_address: 172.20.20.50
      red_ataque:
        ipv4_address: 172.20.30.50
    cap_add:
      - NET_ADMIN
    command: ["sleep", "infinity"]
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: 172.20.20.10
    ports:
      - "8081:80"
    networks:
      red_privada:
    restart: unless-stopped

  panel_control:
    build:
      context: ../panel
      dockerfile: Dockerfile
    container_name: panel_control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5000:5000"
    networks:
      red_ataque:
        ipv4_address: 172.20.30.5
    depends_on:
      - atacante

networks:
  red_publica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.10.0/24

  red_privada:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.20.0/24

  red_ataque:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.30.0/24