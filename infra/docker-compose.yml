version: '3.8'

networks:
  red_publica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.10.0/24
          gateway: 172.20.10.1      

  red_privada:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.20.0/24
          gateway: 172.20.20.1

  red_ataque:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.30.0/24
          gateway: 172.20.30.1

services:
  router:
    build:
      context: .
      dockerfile: router.Dockerfile
    container_name: router
    networks:
      red_publica:
        ipv4_address: 172.20.10.254   
      red_privada:
        ipv4_address: 172.20.20.254   
      red_ataque:
        ipv4_address: 172.20.30.254   
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1 
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: servidor_web
    depends_on:
      - router
    # --- AQUÍ ESTÁ EL CAMBIO CRÍTICO ---
#    deploy:
#      resources:
#        limits:
#          cpus: '0.05'    # Solo el 5% de un núcleo (Asfixia total)
#          memory: 20M     # Casi nada de RAM para que crashee rápido
    # -----------------------------------
    networks:
      red_publica:
        ipv4_address: 172.20.10.10
    sysctls:
      - net.ipv4.tcp_syncookies=0 # <-- Vulnerabilidad lista para tu SYN Flood
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro  
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: >
      sh -c "
        sleep 3 &&
        ip route add 172.20.20.0/24 via 172.20.10.254 2>/dev/null &&
        ip route add 172.20.30.0/24 via 172.20.10.254 2>/dev/null &&
        nginx -g 'daemon off;'
      "
    restart: unless-stopped
    
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: base_datos
    depends_on:
      - router
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: empresa
    networks:
      red_privada:
        ipv4_address: 172.20.20.10
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
        sleep 3 &&
        ip route add 172.20.10.0/24 via 172.20.20.254 2>/dev/null || true &&
        ip route add 172.20.30.0/24 via 172.20.20.254 2>/dev/null || true &&
        exec docker-entrypoint.sh mysqld --bind-address=172.20.20.10 --port=3306
      "
    restart: unless-stopped

  atacante:
    image: dyrnq/nettools:latest
    container_name: atacante
    depends_on:
      - router
    networks:
      red_ataque:
        ipv4_address: 172.20.30.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: >
      sh -c "
        sleep 3 &&
        ip route add 172.20.10.0/24 via 172.20.30.254 2>/dev/null || true &&
        ip route add 172.20.20.0/24 via 172.20.30.254 2>/dev/null || true &&
        tail -f /dev/null
      "
    restart: unless-stopped
  
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: base_datos
    depends_on:
      - router
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: empresa
    networks:
      red_privada:
        ipv4_address: 172.20.20.10
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
        sleep 3 &&
        ip route add 172.20.10.0/24 via 172.20.20.254 2>/dev/null || true &&
        ip route add 172.20.30.0/24 via 172.20.20.254 2>/dev/null || true &&
        exec docker-entrypoint.sh mysqld --bind-address=172.20.20.10 --port=3306
      "
    restart: unless-stopped

  atacante:
    image: dyrnq/nettools:latest
    container_name: atacante
    depends_on:
      - router
    networks:
      red_ataque:
        ipv4_address: 172.20.30.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: >
      sh -c "
        sleep 3 &&
        ip route add 172.20.10.0/24 via 172.20.30.254 2>/dev/null || true &&
        ip route add 172.20.20.0/24 via 172.20.30.254 2>/dev/null || true &&
        tail -f /dev/null
      "
    restart: unless-stopped
  
  monitor:
    image: nicolaka/netshoot:latest
    container_name: monitor
    networks:
      red_publica:
        ipv4_address: 172.20.10.50
      red_privada:
        ipv4_address: 172.20.20.50
      red_ataque:
        ipv4_address: 172.20.30.50
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["sleep", "infinity"]
    restart: unless-stopped
    
  panel_control:
    build: 
      context: ../panel  # <-- Esto le dice a Docker: "Sube un nivel y entra a panel"
      dockerfile: Dockerfile
    container_name: panel_control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5000:5000"
    networks:
      red_ataque:
        ipv4_address: 172.20.30.5
    depends_on:
      - atacante