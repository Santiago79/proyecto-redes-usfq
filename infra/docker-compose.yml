version: '3.8'

networks:
  1_red_publica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.10.0/24
          gateway: 172.20.10.1
  2_red_privada:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.20.0/24
          gateway: 172.20.20.1
  3_red_ataque:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.30.0/24
          gateway: 172.20.30.1

services:
  router:
    build:
      context: .
      dockerfile: router.Dockerfile
    container_name: router
    networks:
      1_red_publica:
        ipv4_address: 172.20.10.254
      2_red_privada:
        ipv4_address: 172.20.20.254
      3_red_ataque:
        ipv4_address: 172.20.30.254
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  web:
    image: php:8.2-apache
    container_name: servidor_web
    depends_on:
      - router
      - db
    networks:
      1_red_publica:
        ipv4_address: 172.20.10.10
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: >
      sh -c "
        apt-get update && apt-get install -y iproute2 &&
        docker-php-ext-install mysqli &&
        sleep 5 &&
        ip route add 172.20.20.0/24 via 172.20.10.254 2>/dev/null || true &&
        ip route add 172.20.30.0/24 via 172.20.10.254 2>/dev/null || true &&
        apache2-foreground
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 50M

  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: base_datos
    depends_on:
      - router
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: empresa
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      2_red_privada:
        ipv4_address: 172.20.20.10
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
        sleep 3 &&
        ip route add 172.20.10.0/24 via 172.20.20.254 2>/dev/null || true &&
        ip route add 172.20.30.0/24 via 172.20.20.254 2>/dev/null || true &&
        exec docker-entrypoint.sh mysqld --bind-address=172.20.20.10 --port=3306
      "
    restart: unless-stopped

  atacante:
    image: dyrnq/nettools:latest
    container_name: atacante
    depends_on:
      - router
    networks:
      3_red_ataque:
        ipv4_address: 172.20.30.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: >
      sh -c "
        apk add --no-cache iperf3 &&
        sleep 3 &&
        ip route add 172.20.10.0/24 via 172.20.30.254 2>/dev/null || true &&
        ip route add 172.20.20.0/24 via 172.20.30.254 2>/dev/null || true &&
        tail -f /dev/null
      "
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: monitor.Dockerfile
    container_name: monitor
    networks:
      1_red_publica:
        ipv4_address: 172.20.10.50
      2_red_privada:
        ipv4_address: 172.20.20.50
      3_red_ataque:
        ipv4_address: 172.20.30.50
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["sleep", "infinity"]
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: base_datos
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 300M
    ports:
      - "8081:80"
    networks:
      2_red_privada: {}
    restart: unless-stopped

  panel_control:
    build: 
      context: ../panel
      dockerfile: Dockerfile
    container_name: panel_control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5000:5000"
    networks:
      3_red_ataque:
        ipv4_address: 172.20.30.5
    depends_on:
      - atacante